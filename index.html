<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Hogwarts Orión</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --fondo: #f0f2f5;
            --primario: #4a154b;
            --oro: #ffcc00;
            --verde: #27ae60;
            --gris: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #e9eff5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BARRA DE PROGRESO GLOBAL */
        .header-album {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border-bottom: 3px solid var(--oro);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .main-reward {
            background: #fff3cd;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 15px;
            border: 2px solid var(--oro);
        }

        .progress-container {
            background: #eee;
            border-radius: 20px;
            height: 25px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* GRILLA DE SETS */
        .sets-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 500px;
        }

        .set-card {
            background: white;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 5px solid white;
            transition: transform 0.2s;
            position: relative;
        }

        .set-card:hover { transform: scale(1.05); }

        .set-icon { width: 80px; height: 80px; margin-bottom: 5px; }

        .set-name { font-size: 12px; font-weight: bold; color: var(--primario); text-transform: uppercase; text-align: center; width: 80%; }

        .set-progress-tag {
            background: var(--primario);
            color: white;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* VISTA DETALLE DEL SET (MODAL) */
        .modal-set {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            background: var(--primario);
            color: white;
            display: flex;
            align-items: center;
        }

        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 15px; }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
        }

        .sticker-slot {
            aspect-ratio: 1/1.3;
            background: #dcdde1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .sticker-slot.owned { background: white; border-color: var(--oro); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .sticker-slot img { width: 90%; height: 70%; object-fit: contain; filter: grayscale(1); opacity: 0.5; }

        .sticker-slot.owned img { filter: grayscale(0); opacity: 1; }

        .sticker-name { font-size: 9px; text-align: center; margin-top: 5px; font-weight: bold; }

        .new-badge {
            position: absolute;
            top: 0; right: 0;
            background: #e74c3c;
            color: white;
            font-size: 8px;
            padding: 2px 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA / IDENTIFICACIÓN -->
    <div id="login-screen" style="padding: 50px; text-align: center;">
        <h2 style="color: var(--primario)">IDENTIFICACIÓN MÁGICA</h2>
        <input type="text" id="username" placeholder="Tu nombre de mago..." style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;"><br><br>
        <button onclick="cargarAlbum()" style="padding: 10px 20px; background: var(--primario); color: white; border: none; border-radius: 5px;">ABRIR ÁLBUM</button>
    </div>

    <!-- ÁLBUM PRINCIPAL -->
    <div id="album-content" style="display: none; width: 100%;">
        <div class="header-album">
            <h1 style="font-size: 18px; margin: 0; color: var(--primario);">COSECHA MÁGICA ORIÓN</h1>
            <p style="font-size: 11px; color: #666;">Completa el álbum para ganar <b>5,000 Esencias</b></p>
            
            <div class="main-reward">
                <span>🎲 1,000</span>
                <img src="https://cdn-icons-png.flaticon.com/512/1043/1043440.png" width="40">
                <span>🔸 5k</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="global-bar"></div>
                <div style="position: absolute; top: 3px; left: 45%; font-size: 12px; font-weight: bold;" id="global-txt">0 / 18</div>
            </div>
        </div>

        <div class="sets-grid" id="sets-container">
            <!-- Los sets se generan aquí -->
        </div>
    </div>

    <!-- DETALLE DEL SET -->
    <div id="modal-set" class="modal-set">
        <div class="modal-header">
            <button class="back-btn" onclick="cerrarSet()">←</button>
            <div>
                <h2 id="modal-set-name" style="margin: 0; font-size: 18px;">Nombre del Set</h2>
                <span id="modal-set-progress" style="font-size: 12px;">0 / 9 Cromos</span>
            </div>
        </div>
        <div class="sticker-grid" id="sticker-grid">
            <!-- Los 9 cromos se generan aquí -->
        </div>
        <div id="set-reward-msg" style="text-align: center; padding: 20px; color: var(--verde); font-weight: bold; display: none;">
            🎉 ¡SET COMPLETADO! +500 Esencias
        </div>
    </div>

<script>
    const fbURL = "https://album-75178-default-rtdb.firebaseio.com/"; // TU FIREBASE
    let alumnoLogueado = "";
    let cromosPoseidos = new Set();

    // DEFINICIÓN DE LOS SETS (Igual que Monopoly Go)
    const albumData = [
        {
            id: "set1",
            name: "Aulas de Magia",
            icon: "🏰",
            stickers: [
                { id: 1, name: "Caldero Antiguo" },
                { id: 2, name: "Varita Sauce" },
                { id: 3, name: "Pergamino" },
                { id: 4, name: "Tinta Roja" },
                { id: 5, name: "Libro Pociones" },
                { id: 6, name: "Matraz" },
                { id: 7, name: "Pluma de Fénix" },
                { id: 8, name: "Mesa Roble" },
                { id: 9, name: "Reloj Arena" }
            ]
        },
        {
            id: "set2",
            name: "Criaturas",
            icon: "🐉",
            stickers: [
                { id: 10, name: "Hipogrifo" },
                { id: 11, name: "Escarbato" },
                { id: 12, name: "Thestral" },
                { id: 13, name: "Fénix" },
                { id: 14, name: "Basilisco" },
                { id: 15, name: "Duendecillo" },
                { id: 16, name: "Centauro" },
                { id: 17, name: "Sirena" },
                { id: 18, name: "Dragón" }
            ]
        }
    ];

    async function cargarAlbum() {
        const input = document.getElementById('username').value.trim();
        if(!input) return alert("Ingresa tu nombre.");
        alumnoLogueado = input.replace(/[\.\#\$\[\]]/g, "_");

        // 1. Obtener cromos de Firebase (de tu sistema actual)
        try {
            const res = await fetch(`${fbURL}usuarios/${alumnoLogueado}.json`);
            const data = await res.json();
            
            cromosPoseidos.clear();
            if(data) {
                Object.keys(data).forEach(id => {
                    if(data[id] === true) cromosPoseidos.add(parseInt(id));
                });
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('album-content').style.display = 'block';
            
            renderSets();
            actualizarProgresoGlobal();
        } catch(e) {
            alert("Error conectando con el Ministerio.");
        }
    }

    function renderSets() {
        const container = document.getElementById('sets-container');
        container.innerHTML = "";

        albumData.forEach(set => {
            const poseidosEnSet = set.stickers.filter(s => cromosPoseidos.has(s.id)).length;
            const card = document.createElement('div');
            card.className = "set-card";
            card.onclick = () => abrirSet(set);
            
            card.innerHTML = `
                <div style="font-size: 50px;">${set.icon}</div>
                <div class="set-name">${set.name}</div>
                <div class="set-progress-tag">${poseidosEnSet} / ${set.stickers.length}</div>
            `;
            container.appendChild(card);
        });
    }

    function abrirSet(set) {
        document.getElementById('modal-set').style.display = 'flex';
        document.getElementById('modal-set-name').innerText = set.name;
        
        const grid = document.getElementById('sticker-grid');
        grid.innerHTML = "";

        let poseidos = 0;
        set.stickers.forEach(s => {
            const isOwned = cromosPoseidos.has(s.id);
            if(isOwned) poseidos++;

            const slot = document.createElement('div');
            slot.className = `sticker-slot ${isOwned ? 'owned' : ''}`;
            slot.innerHTML = `
                <img src="https://i.postimg.cc/R3GqhsDv/1.jpg" alt="${s.name}">
                <div class="sticker-name">${s.name}</div>
                ${isOwned ? '' : '<div style="font-size:10px; color:#999;">FALTANTE</div>'}
            `;
            grid.appendChild(slot);
        });

        document.getElementById('modal-set-progress').innerText = `${poseidos} / ${set.stickers.length} CROMOS`;
        
        if(poseidos === set.stickers.length) {
            document.getElementById('set-reward-msg').style.display = 'block';
        } else {
            document.getElementById('set-reward-msg').style.display = 'none';
        }
    }

    function cerrarSet() {
        document.getElementById('modal-set').style.display = 'none';
    }

    function actualizarProgresoGlobal() {
        const totalCromos = albumData.reduce((acc, set) => acc + set.stickers.length, 0);
        const poseidos = cromosPoseidos.size;
        const porcentaje = (poseidos / totalCromos) * 100;

        document.getElementById('global-bar').style.width = porcentaje + "%";
        document.getElementById('global-txt').innerText = `${poseidos} / ${totalCromos}`;
    }
</script>

</body>
</html>
